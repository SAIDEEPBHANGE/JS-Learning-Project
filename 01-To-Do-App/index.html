<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do-App</title>
    <link rel="stylesheet" href="/01-To-Do-App/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="container-fluid">
    <div class="h1 fw-bold text-center">To-Do app</div>
    <div class="input-group my-3">
      <input
        type="text"
        class="form-control"
        id="TaskInput"
        placeholder="Task Example: Need to Mail...."
      />
      <button class="btn btn-outline-success" type="button" id="Add-Task">
        Add Task
      </button>
      <button class="btn btn-outline-danger" type="button" id="Clear-Task">
        Clear
      </button>
    </div>
    <div class="border p-3">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          placeholder="Search Task"
          id="Input-Action"
        />
        <select id="Input-Select" class="form-select" style="max-width: 150px">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="done">Done</option>
        </select>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>Task</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="TaskBody"></tbody>
      </table>
    </div>
    <script src="/01-To-Do-App/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
