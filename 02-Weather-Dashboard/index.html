<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/02-Weather-Dashboard/css/style.css" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <div class="card shadow-lg border-0 rounded-4">
            <div
              class="card-header bg-primary text-white text-center rounded-top-4"
            >
              <h2>
                <i class="bi bi-cloud-sun-fill"></i>
                Weather Dashboard
              </h2>
            </div>
            <div class="card-body">
              <div class="input-group mb-4">
                <input
                  type="text"
                  id="city"
                  class="form-control"
                  placeholder="Enter city name..."
                />
                <button class="btn btn-primary" id="searchBtn">
                  <i class="bi bi-search"></i>
                  Search
                </button>
              </div>
              <div id="weatherCard" class="text-center d-none">
                <h3 id="cityName" class="fs-4 text-muted"></h3>
                <div id="weatherIconContainer" class="my-2"></div>
                <h1 id="temp"></h1>
                <p id="description" class="text-capitalize fw-semibold"></p>

                <div class="row mt-4">
                  <div class="col">
                    <i class="bi bi-droplet-fill text-primary fs-3"></i>
                    <h6>Humidity</h6>
                    <p id="humidity"></p>
                  </div>
                  <div class="col">
                    <i class="bi bi-wind fs-3 text-success"></i>
                    <h6>Wind</h6>
                    <p id="wind"></p>
                  </div>
                  <div class="col">
                    <i class="bi bi-thermometer-half fs-3 text-danger"></i>
                    <h6>Feels Like</h6>
                    <p id="feelsLike"></p>
                  </div>
                </div>
              </div>

              <div id="error" class="text-center mt-3 d-none">
                <div
                  class="alert alert-danger d-inline-flex align-items-center gap-2"
                  role="alert"
                >
                  <i class="bi bi-exclamation-triangle-fill"></i>
                  <span id="errorMsg">City not found!</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/02-Weather-Dashboard/js/app.js"></script>
  </body>
</html>
