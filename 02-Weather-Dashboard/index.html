  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Advanced Weather Dashboard</title>
      <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
      />
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      />
    </head>
    <body class="min-vh-100 bg-light">
      <div class="container py-5">
        <div class="row g-4 justify-content-center">
          <div class="col-lg-4">
            <div class="card shadow-lg border-0 rounded-4 mb-4">
              <div class="card-body">
                <h5 class="card-title fw-bold mb-3">Location Search</h5>
                <div class="input-group mb-2">
                  <input
                    type="text"
                    id="city"
                    class="form-control"
                    placeholder="Enter city name..."
                  />
                  <button class="btn btn-primary" id="searchBtn">
                    <i class="bi bi-search"></i>
                  </button>
                </div>
                <button
                  class="btn btn-outline-secondary w-100 mb-3 btn-sm"
                  id="geoBtn"
                >
                  <i class="bi bi-geo-alt-fill"></i> Detect My Location
                </button>
                <div
                  class="d-flex justify-content-between align-items-center border-top pt-3"
                >
                  <span class="fw-semibold text-muted small"
                    >Temperature Unit:</span
                  >
                  <div class="btn-group btn-group-sm" role="group">
                    <input
                      type="radio"
                      class="btn-check"
                      name="unitToggle"
                      id="unitC"
                      checked
                    />
                    <label class="btn btn-outline-primary" for="unitC">°C</label>
                    <input
                      type="radio"
                      class="btn-check"
                      name="unitToggle"
                      id="unitF"
                    />
                    <label class="btn btn-outline-primary" for="unitF">°F</label>
                  </div>
                </div>
              </div>
            </div>
            <div class="card shadow-lg border-0 rounded-4">
              <div class="card-body">
                <h6 class="fw-bold text-muted mb-2">Recent Searches</h6>
                <div
                  id="recentSearches"
                  class="list-group list-group-flush small rounded-3 overflow-hidden"
                ></div>
              </div>
            </div>
          </div>
          <div class="col-lg-8">
            <div
              id="error"
              class="alert alert-danger d-none rounded-4 shadow-sm"
              role="alert"
            >
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              <span id="errorMsg">City not found! Please check spelling.</span>
            </div>
            <div id="weatherContent" class="d-none">
              <div
                class="card shadow-lg border-0 rounded-4 mb-4 text-white bg-dark"
              >
                <div class="card-body p-4 text-center">
                  <h3 id="cityName" class="fw-bold fs-4 m-0"></h3>
                  <div
                    id="weatherIconContainer"
                    class="my-2"
                  ></div>
                  <h1 id="temp" class="display-3 fw-bold m-0"></h1>
                  <p
                    id="description"
                    class="text-capitalize fs-5 mb-0 opacity-90"
                  ></p>
                </div>
              </div>
              <div class="row g-3 mb-4">
                <div class="col-sm-6 col-md-4">
                  <div
                    class="card h-100 border-0 shadow-sm text-center rounded-4"
                  >
                    <div class="card-body py-3">
                      <i class="bi bi-droplet-fill text-primary fs-3"></i>
                      <h6 class="text-muted small mt-1">Humidity</h6>
                      <p id="humidity" class="fw-bold fs-5 mb-0">-</p>
                    </div>
                  </div>
                </div>
                <div class="col-sm-6 col-md-4">
                  <div
                    class="card h-100 border-0 shadow-sm text-center rounded-4"
                  >
                    <div class="card-body py-3">
                      <i class="bi bi-wind text-success fs-3"></i>
                      <h6 class="text-muted small mt-1">Wind Speed</h6>
                      <p id="wind" class="fw-bold fs-5 mb-0">-</p>
                    </div>
                  </div>
                </div>
                <div class="col-sm-6 col-md-4">
                  <div
                    class="card h-100 border-0 shadow-sm text-center rounded-4"
                  >
                    <div class="card-body py-3">
                      <i class="bi bi-thermometer-half text-danger fs-3"></i>
                      <h6 class="text-muted small mt-1">Feels Like</h6>
                      <p id="feelsLike" class="fw-bold fs-5 mb-0">-</p>
                    </div>
                  </div>
                </div>
                <div class="col-sm-6 col-md-4">
                  <div
                    class="card h-100 border-0 shadow-sm text-center rounded-4"
                  >
                    <div class="card-body py-3">
                      <i class="bi bi-sun-fill text-warning fs-3"></i>
                      <h6 class="text-muted small mt-1">UV Index</h6>
                      <p id="uvIndex" class="fw-bold fs-5 mb-0">-</p>
                    </div>
                  </div>
                </div>
                <div class="col-sm-6 col-md-4">
                  <div
                    class="card h-100 border-0 shadow-sm text-center rounded-4"
                  >
                    <div class="card-body py-3">
                      <i class="bi bi-shield-fill-check text-info fs-3"></i>
                      <h6 class="text-muted small mt-1">Air Quality Index</h6>
                      <p id="aqi" class="fw-bold fs-5 mb-0">-</p>
                    </div>
                  </div>
                </div>
                <div class="col-sm-6 col-md-4">
                  <div
                    class="card h-100 border-0 shadow-sm text-center rounded-4"
                  >
                    <div class="card-body py-3">
                      <i class="bi bi-horizon-fill text-secondary fs-3"></i>
                      <h6 class="text-muted small mt-1">Sun Cycle</h6>
                      <div class="small mt-1">
                        <div>
                          <i class="bi bi-sunrise text-warning"></i>
                          <span id="sunrise">-</span>
                        </div>
                        <div>
                          <i class="bi bi-sunset text-danger"></i>
                          <span id="sunset">-</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="card shadow-lg border-0 rounded-4 mb-4">
                <div class="card-body p-4">
                  <h5 class="fw-bold mb-3">
                    <i class="bi bi-calendar3 me-2"></i>5-Day Forecast
                  </h5>
                  <div
                    id="forecastContainer"
                    class="row row-cols-1 row-cols-sm-5 g-2 text-center"
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
      <script src="./js/app.js"></script>
    </body>
  </html>
