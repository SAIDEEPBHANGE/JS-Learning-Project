<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm">
      <div class="container d-flex justify-content-between align-items-center">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2 mb-0"
          href="#"
        >
          <i class="bi bi-wallet2 fs-4 text-info"></i>
          <span>Expense Tracker</span>
        </a>
        <select class="form-select w-auto py-1.5" id="MonthSelect"></select>
      </div>
    </nav>
    <div class="container py-4">
      <div class="row g-3 mb-4" id="ExpenseSummaryCard">
        <div class="col-sm-6 col-md-3">
          <div class="card border-start border-4 border-success shadow-sm bg-white">
            <div class="card-body">
              <h6 class="text-muted">Total Income</h6>
              <h3 class="text-success">₹0.00</h3>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-3">
          <div class="card border-start border-4 border-danger shadow-sm bg-white">
            <div class="card-body">
              <h6 class="text-muted">Total Expense</h6>
              <h3 class="text-danger">₹0.00</h3>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-3">
          <div class="card border-start border-4 border-info shadow-sm bg-white">
            <div class="card-body">
              <h6 class="text-muted">Balance</h6>
              <h3 class="text-dark">₹0.00</h3>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-3">
          <div class="card border-start border-4 border-warning shadow-sm bg-white">
            <div class="card-body">
              <div
                class="d-flex justify-content-between align-items-center mb-1"
              >
                <h6 class="text-muted mb-0">Budget</h6>
                <button
                  class="btn btn-sm btn-link text-warning p-0 border-0"
                  id="editBudgetBtn"
                >
                  <i class="bi bi-pencil-square fs-6"></i>
                </button>
              </div>
              <h3 id="budgetAmount">₹0.00</h3>
              <div
                class="input-group input-group-sm mt-2 d-none"
                id="budgetEditBox"
              >
                <input
                  type="number"
                  class="form-control"
                  id="budgetInput"
                  placeholder="Enter budget"
                  min="0"
                />
                <button class="btn btn-success px-3" id="saveBudgetBtn">
                  Save
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-xl-8 col-lg-7">
          <div class="card shadow-sm mb-3 bg-white">
            <div class="card-header bg-transparent fw-semibold">
              <i class="bi bi-plus-circle-fill text-primary me-2"></i>Add
              Transaction
            </div>
            <div class="card-body">
              <form id="transactionForm">
                <div class="row g-3">
                  <div class="col-md-5 col-sm-6">
                    <label class="form-label small fw-medium"
                      >Transaction Title</label
                    >
                    <input
                      id="transactionTitle"
                      class="form-control"
                      placeholder="e.g., Office Grocery"
                      required
                    />
                  </div>
                  <div class="col-md-3 col-sm-3">
                    <label class="form-label small fw-medium">Amount</label>
                    <div class="input-group">
                      <span class="input-group-text">₹</span>
                      <input
                        id="transactionAmount"
                        type="number"
                        step="0.01"
                        class="form-control"
                        placeholder="0.00"
                        required
                      />
                    </div>
                  </div>
                  <div class="col-md-4 col-sm-3">
                    <label class="form-label small fw-medium">Date</label>
                    <input
                      id="transactionDate"
                      type="date"
                      class="form-control text-muted"
                      required
                    />
                  </div>
                  <div class="col-md-5 col-sm-6" id="TransactionType">
                    <label class="form-label small fw-medium"
                      >Transaction Type</label
                    >
                    <div class="d-flex gap-2">
                      <input
                        type="radio"
                        class="btn-check"
                        name="type"
                        id="income"
                        checked
                      />
                      <label
                        class="btn btn-outline-success flex-fill"
                        for="income"
                      >
                        <i class="bi bi-arrow-down-left-circle me-1"></i>Income
                      </label>
                      <input
                        type="radio"
                        class="btn-check"
                        name="type"
                        id="expense"
                      />
                      <label
                        class="btn btn-outline-danger flex-fill"
                        for="expense"
                      >
                        <i class="bi bi-arrow-up-right-circle me-1"></i>Expense
                      </label>
                    </div>
                  </div>
                  <div class="col-md-4 col-sm-6">
                    <label class="form-label small fw-medium">Category</label>
                    <select class="form-select" id="TypeCategory"></select>
                  </div>
                  <div class="col-md-3 col-sm-6 d-flex align-items-end">
                    <button
                      type="submit"
                      class="btn btn-primary w-100 py-2 fw-semibold shadow-sm"
                    >
                      <i class="bi bi-check-circle me-1"></i>Save Entry
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
          <div class="card shadow-sm mb-3 bg-white">
            <div class="card-body py-2 px-3">
              <div class="row g-2 align-items-center">
                <div class="col-md-9 col-sm-8">
                  <div class="input-group input-group-sm">
                    <span
                      class="input-group-text border-end-0 bg-transparent text-muted"
                      ><i class="bi bi-search"></i
                    ></span>
                    <input
                      id="searchInput"
                      class="form-control border-start-0"
                      placeholder="Search transactions by title..."
                    />
                  </div>
                </div>
                <div class="col-md-3 col-sm-4">
                  <button
                    id="clearFiltersBtn"
                    class="btn btn-sm btn-outline-secondary w-100"
                  >
                    Clear Filters
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="card shadow-sm bg-white mb-4">
            <div
              class="card-header bg-transparent d-flex justify-content-between align-items-center"
            >
              <div class="d-flex align-items-center gap-2">
                <span class="fw-semibold">Recent Transactions</span>
                <span
                  id="totalCountBadge"
                  class="badge bg-primary-subtle text-primary rounded-pill px-2"
                  >0 total</span
                >
              </div>
              <button
                id="exportCsvBtn"
                class="btn btn-sm btn-outline-success font-monospace px-2 py-1"
              >
                <i class="bi bi-file-earmark-arrow-down me-1"></i>Export CSV
              </button>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0 text-nowrap">
                <thead>
                  <tr>
                    <th class="ps-4">Title</th>
                    <th>Category</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th class="text-end pe-4">Actions</th>
                  </tr>
                </thead>
                <tbody id="TransactionTbody"></tbody>
              </table>
            </div>
            <div
              class="card-footer bg-transparent py-3 px-4 border-top border-light"
            >
              <div class="d-flex justify-content-between align-items-center">
                <span id="paginationInfo" class="text-muted small"
                  >Showing 0-0 of 0 items</span
                >
                <ul
                  class="pagination pagination-sm mb-0"
                  id="paginationControls"
                ></ul>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-4 col-lg-5">
          <div class="card shadow-sm h-100 bg-white">
            <div class="card-header bg-transparent fw-semibold">
              <i class="bi bi-pie-chart-fill text-primary me-2"></i>Expense
              Breakdown
            </div>
            <div
              class="card-body d-flex align-items-center justify-content-center"
            >
              <div class="ratio ratio-1x1">
                <canvas id="expenseChart"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
