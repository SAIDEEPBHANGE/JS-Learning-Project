<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieHub - Search & Track Shows</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm"
    >
      <div class="container">
        <a href="#" id="brandLogo" class="navbar-brand fw-bold fs-3 text-danger"
          >🎬 MovieHub</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-semibold">
            <li class="nav-item">
              <a class="nav-link active" id="navHome" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" id="navFavorites" href="#"
                >Favorites
                <span class="badge bg-danger" id="favCount">0</span></a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" id="navWatchlist" href="#"
                >Watchlist
                <span class="badge bg-warning text-dark" id="watchCount"
                  >0</span
                ></a
              >
            </li>
          </ul>
          <div class="d-flex align-items-center" id="authSection"></div>
        </div>
      </div>
    </nav>
    <section class="hero">
      <div class="container text-center">
        <h1 class="display-4 mb-3">Discover Your Next Binge</h1>
        <p class="lead mb-4 text-white-50">
          Track your favorite shows, manage your watchlist, and explore top
          trending titles.
        </p>
        <div class="search-box">
          <div class="input-group input-group-lg shadow-lg">
            <input
              id="searchInput"
              class="form-control border-0 shadow-none ps-4"
              placeholder="Type to search shows instantly (Debounced)..."
            />
            <button id="clearBtn" class="btn btn-warning px-3 border-0">
              <i class="bi bi-x-circle-fill"></i>
            </button>
          </div>
        </div>
        <div class="container mt-4">
          <div
            class="d-flex flex-wrap justify-content-center gap-2"
            id="genreFilterContainer"
          >
            <button
              class="btn btn-sm btn-outline-light active genre-btn"
              data-genre="all"
            >
              All Genres
            </button>
            <button
              class="btn btn-sm btn-outline-light genre-btn"
              data-genre="Action"
            >
              Action
            </button>
            <button
              class="btn btn-sm btn-outline-light genre-btn"
              data-genre="Comedy"
            >
              Comedy
            </button>
            <button
              class="btn btn-sm btn-outline-light genre-btn"
              data-genre="Drama"
            >
              Drama
            </button>
            <button
              class="btn btn-sm btn-outline-light genre-btn"
              data-genre="Horror"
            >
              Horror
            </button>
            <button
              class="btn btn-sm btn-outline-light genre-btn"
              data-genre="Romance"
            >
              Romance
            </button>
            <button
              class="btn btn-sm btn-outline-light genre-btn"
              data-genre="Sci-Fi"
            >
              Sci-Fi
            </button>
            <button
              class="btn btn-sm btn-outline-light genre-btn"
              data-genre="Thriller"
            >
              Thriller
            </button>
          </div>
        </div>
      </div>
    </section>
    <main class="container py-5">
      <div
        class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2"
      >
        <h2 id="sectionTitle" class="fw-bold text-dark">Trending Shows</h2>
        <span id="resultStats" class="text-muted small"
          >Showing top titles</span
        >
      </div>
      <div id="showContainer" class="row g-4"></div>
      <div id="infiniteScrollTrigger" class="text-center py-5 d-none">
        <div class="spinner-border text-danger" role="status">
          <span class="visually-hidden">Loading more...</span>
        </div>
      </div>
    </main>
    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div
          class="modal-content bg-dark text-white border-0 rounded-4 overflow-hidden shadow-2xl"
        >
          <div class="modal-header border-0 position-absolute end-0 top-0 z-3">
            <button
              type="button"
              class="btn-close btn-close-white bg-black bg-opacity-50 p-2 rounded-circle"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-0">
            <div id="modalDynamicContent"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
