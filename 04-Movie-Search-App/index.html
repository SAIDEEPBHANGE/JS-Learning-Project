<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Search App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/04-Movie-Search-App/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark sticky-top">
      <div class="container">
        <a onclick="getShows()" class="navbar-brand fw-bold">🎬 MovieHub</a>
      </div>
    </nav>
    <section class="hero">
      <div class="container text-center">
        <h1>Search TV Shows</h1>
        <div class="search-box mt-3">
          <div class="input-group input-group-lg">
            <input
              id="searchInput"
              class="form-control border-0 shadow-none"
              placeholder="Search show..."
            />
            <button id="searchBtn" class="btn btn-danger">
              <i class="bi bi-search"></i> Search
            </button>
            <button id="clearBtn" class="btn btn-warning">
              <i class="bi bi-x-circle"></i> Clear Filter
            </button>
          </div>
        </div>
      </div>
    </section>
    <section class="container py-5">
      <div id="showContainer" class="row g-4"></div>
    </section>
    <script src="/04-Movie-Search-App/js/app.js"></script>
  </body>
</html>
